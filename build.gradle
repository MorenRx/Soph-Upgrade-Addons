plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

dependencies {
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-${mod_loader}-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-${mod_loader}:${jei_version}"

    // 精妙背包
    implementation modrinth("sophisticated-backpacks:1.21.1-3.26.6.2174")
    implementation modrinth("sophisticated-core:1.21.1-1.5.2.2343")

    // RS2
    implementation modrinth("refined-storage:2.0.9")
    // AE2
    implementation modrinth("ae2:19.2.18")
    runtimeOnly modrinth("guideme:21.1.19")
    // 超越维度
    implementation modrinth("beyonddimensions:0.7.30-1.21.1-neoforge")
    // Tom's Storage
    implementation modrinth("toms-storage:1.21-2.4.2")

    // Thirst Was Reclaimed
    implementation modrinth("thirst-was-reclaimed:1.21.1-3.0.6")
    // Thirst Was Taken
    compileOnly modrinth("thirst-was-taken:1.21.1-2.1.5")
    // Legendary Survival Overhaul
    implementation modrinth("legendary-survival-overhaul:1.21.1-2.4.7.2")
    // Tough As Nails
    implementation modrinth("tough-as-nails:10.1.0.13")
    runtimeOnly modrinth("glitchcore:2.1.0.2")
    // 农夫乐事
    runtimeOnly modrinth("farmers-delight:1.21.1-1.3.4")

    // 神化
    implementation modrinth("apotheosis:1.21.1-8.9.0")
    implementation modrinth("placebo:1.21.1-9.9.2")
    implementation modrinth("apothic-attributes:1.21.1-2.11.0")
    // 品质附加
    runtimeOnly "curse.maven:nadir-1424172:8687490"

    // 测试用
    runtimeOnly modrinth("embeddium:1.0.15+mc1.21.1")
    runtimeOnly modrinth("ferrite-core:7.0.3-neoforge")
    runtimeOnly modrinth("appleskin:3.0.9+mc1.21")
    runtimeOnly modrinth("cad-editor:0.1.0")
    runtimeOnly modrinth("mouse-tweaks:1.21-2.26.1-neoforge")
    runtimeOnly modrinth("justenoughcharacters:4.5.29")
}

repositories {
    mavenCentral()
    maven {
        name = "LocalRepo"
        url = layout.projectDirectory.dir(".local-repo")
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

version = mod_version
group = mod_group_id
base.archivesName = archives_name

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version          : minecraft_version,
            minecraft_version_range    : minecraft_version_range,
            neo_version                : neo_version,
            neo_version_range          : neo_version_range,
            loader_version_range       : loader_version_range,
            soph_backpack_version_range: soph_backpack_version_range,
            soph_core_version_range    : soph_core_version_range,
            mod_id                     : mod_id,
            mod_name                   : mod_name,
            mod_license                : mod_license,
            mod_version                : mod_version,
            mod_authors                : mod_authors,
            mod_description            : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

neoForge {
    version = project.neo_version

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    ideSyncTask(generateModMetadata)
}

def modrinth(String notation) {
    return "maven.modrinth:${notation}-${mod_loader},${minecraft_version}"
}

sourceSets.main.resources {
    srcDir(generateModMetadata)
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}