plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // 精妙背包
    implementation modrinth("sophisticated-backpacks:1.20.1-3.26.6.2176")
    implementation modrinth("sophisticated-core:1.20.1-1.5.4.2362")

    // RS
    implementation modrinth("refined-storage:1.12.4")
    // AE2
    implementation modrinth("ae2:15.4.11")
    runtimeOnly modrinth("guideme:20.1.15")
    // 超越维度
    implementation modrinth("beyonddimensions:0.7.30-1.20.1-forge")
    // Tom's Storage
    implementation modrinth("toms-storage:1.20-1.7.1")

    // Thirst Was Reclaimed
    implementation modrinth("thirst-was-reclaimed:1.20.1-3.0.5")
    // Thirst Was Taken
    compileOnly modrinth("thirst-was-taken:1.20.1-1.4.0")
    // Legendary Survival Overhaul
    compileOnly modrinth("legendary-survival-overhaul:1.20.1-2.4.7")
    // Tough As Nails
    compileOnly modrinth("tough-as-nails:9.2.0.171")
    runtimeOnly modrinth("glitchcore:0.0.1.1")
    // 农夫乐事
    runtimeOnly modrinth("farmers-delight:1.20.1-1.3.4")

    // 神化
    implementation modrinth("apotheosis:7.4.8")
    implementation modrinth("placebo:8.6.3")
    implementation modrinth("apothic-attributes:1.3.7")
    // 神化附加
    runtimeOnly fg.deobf("curse.maven:apotheotic-additions-924640:6393313")

    // 测试用
    runtimeOnly modrinth("embeddium:0.3.31+mc1.20.1")
    runtimeOnly modrinth("ferrite-core:6.0.1")
    runtimeOnly modrinth("appleskin:2.5.1+mc1.20.1")
    runtimeOnly modrinth("ibe-editor:2.2.8+1.20-forge")
    runtimeOnly modrinth("mouse-tweaks:1.20.1-2.25.1-forge")
    runtimeOnly modrinth("justenoughcharacters:4.6.11")
}

repositories {
    maven {
        name = "LocalRepo"
        url = layout.projectDirectory.dir(".local=repo")
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseForge"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

group = mod_group_id
version = mod_version
base.archivesName = archives_name + "-${minecraft_version}"

processResources {
    var replaceProperties = [
            minecraft_version           : minecraft_version,
            minecraft_version_range     : minecraft_version_range,
            forge_version               : forge_version,
            forge_version_range         : forge_version_range,
            loader_version_range        : loader_version_range,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_license                 : mod_license,
            mod_version                 : mod_version,
            mod_authors                 : mod_authors,
            mod_description             : mod_description,
            soph_backpack_version_range : soph_backpack_version_range,
            soph_core_version_range     : soph_core_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

def modrinth(String notation) {
    return fg.deobf("maven.modrinth:${notation}-${mod_loader},${minecraft_version}")
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}